name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Shared tests (JVM)
        run: ./gradlew :shared:testAndroidHostTest --console=plain
      - name: Android debug build
        run: ./gradlew :androidApp:assembleDebug --console=plain
      - name: Cloudflare function tests
        working-directory: cloudflare
        run: npm ci && npm test
      - name: Store listing lengths
        run: python3 tools/store/check_lengths.py

  # Publishes the website, admin panel and /api/config to Cloudflare Pages.
  # Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see docs/yayin.md).
  deploy-web:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build web
        run: ./gradlew :webApp:composeCompatibilityBrowserDistribution --console=plain
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: cloudflare
        run: npm ci && npx wrangler pages deploy --branch main
