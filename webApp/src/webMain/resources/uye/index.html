<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Üyelik · Mercan Kuyumculuk Osmaniye</title>
    <meta name="description" content="Mercan Kuyumculuk üyeliği: üyelere özel fiyatlar, kuponlar ve kampanya bildirimleri.">
    <meta name="theme-color" content="#faf8f4">
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="/assets/site.css?v=202611191210">
    <style>
        .acc { max-width: 980px; }
        .auth { max-width: 460px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 30px; box-shadow: var(--shadow); }
        .auth h2 { font: 500 34px/1.1 var(--serif); margin: 0 0 6px; }
        .auth p { color: var(--muted); margin: 0 0 18px; }
        .field { display: grid; gap: 6px; margin-bottom: 14px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
        .field input { height: 50px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--paper); padding: 0 14px; font: 500 15px var(--sans); color: var(--ink); }
        .field input:focus { outline: 2px solid var(--gold-2); border-color: transparent; }
        .err { color: var(--down); font-size: 14px; min-height: 1.2em; margin: 0 0 10px; }
        .switch { text-align: center; margin-top: 16px; font-size: 14px; color: var(--muted); }
        .switch button { border: 0; background: none; color: var(--gold); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
        .acc-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
        .acc-head h1 { font: 500 clamp(38px, 4.6vw, 58px)/1 var(--serif); margin: 12px 0 0; }
        .acc-tabs { margin-bottom: 18px; width: fit-content; max-width: 100%; }
        .panel { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 24px; }
        .coupon { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; padding: 18px; border: 1px dashed var(--gold-2); border-radius: 18px; background: linear-gradient(135deg, #fff, var(--gold-soft)); margin-bottom: 12px; }
        .coupon h3 { margin: 0; font: 600 24px/1.1 var(--serif); }
        .coupon .code { font: 700 18px/1 ui-monospace, Menlo, monospace; letter-spacing: .14em; padding: 10px 14px; background: #fff; border: 1px solid var(--line-2); border-radius: 12px; align-self: center; }
        .coupon .meta { font-size: 13px; color: var(--muted); }
        .coupon.used { opacity: .55; background: var(--paper); }
        .msg { padding: 16px 0; border-bottom: 1px solid var(--line); }
        .msg:last-child { border-bottom: 0; }
        .msg h3 { margin: 0 0 4px; font-size: 16px; display: flex; gap: 8px; align-items: center; }
        .msg h3 .new { width: 8px; height: 8px; border-radius: 50%; background: var(--down); }
        .msg p { margin: 0 0 4px; color: var(--ink-2); white-space: pre-line; }
        .msg time { font-size: 12px; color: var(--muted); }
        .deals td.member { color: var(--gold); font-weight: 600; }
        .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
        .acc-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
    </style>
</head>
<body>
<div id="chrome-top"></div>
<main class="wrap page acc">
    <div class="page-hero" style="padding-bottom:24px">
        <span class="eyebrow">Mercan Üyelik</span>
    </div>
    <div id="view"></div>
</main>
<div id="chrome-bottom"></div>
<script type="module" src="/assets/member.js?v=202611191210"></script>
</body>
</html>
