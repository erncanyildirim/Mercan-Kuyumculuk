<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Mağaza Ekranı · Mercan Kuyumculuk</title>
    <meta name="theme-color" content="#0b0a08">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@500;600;700;800&display=swap">
    <style>
        :root {
            --onyx: #0b0a08; --ivory: #f4ede0; --mute: rgba(244, 237, 224, .55); --gold: #e6bf55; --gold-hi: #fbe7a1;
            --line: rgba(232, 200, 120, .22); --up: #6fd39a; --down: #ff7a6b; --coral: #ef7f63;
            --grad: linear-gradient(115deg, #8a6417 0%, #e6bf55 28%, #fff1b8 46%, #e2b443 62%, #8f6a1a 100%);
            /* everything scales with the screen: 1vmin-based unit on a 16:9 stage */
            --u: min(1vw, 1.7778vh);
        }
        * { box-sizing: border-box; font-variant-numeric: lining-nums tabular-nums !important; }
        html, body { margin: 0; height: 100%; background: var(--onyx); color: var(--ivory); font-family: Manrope, system-ui, sans-serif; overflow: hidden; cursor: none; }
        body { display: grid; place-items: center; }
        .stage {
            width: calc(var(--u) * 100); height: calc(var(--u) * 56.25); position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr);
            padding: calc(var(--u) * 2.2) calc(var(--u) * 2.6) calc(var(--u) * 1.2); gap: calc(var(--u) * 1.6); isolation: isolate; overflow: hidden;
        }
        .stage::before {
            content: ""; position: absolute; z-index: -1; width: 70%; aspect-ratio: 1; right: -18%; top: -40%; border-radius: 50%;
            background: radial-gradient(closest-side, rgba(230, 191, 85, .18), rgba(239, 127, 99, .05) 60%, transparent 72%);
            animation: drift 18s ease-in-out infinite alternate;
        }
        .stage::after {
            content: ""; position: absolute; z-index: -1; width: 60%; aspect-ratio: 1; left: -20%; bottom: -50%; border-radius: 50%;
            background: radial-gradient(closest-side, rgba(230, 191, 85, .1), transparent 70%);
        }
        @keyframes drift { to { transform: translate(-6%, 8%) scale(1.1); } }
        header { display: flex; align-items: center; gap: calc(var(--u) * 1.6); }
        header img { width: calc(var(--u) * 6.4); filter: drop-shadow(0 0 calc(var(--u) * 1.4) rgba(249, 222, 20, .35)); }
        .brand { font: 600 calc(var(--u) * 3.4)/1 "Cormorant Garamond", serif; }
        .brand small { display: block; font: 700 calc(var(--u) * .9)/1 Manrope, sans-serif; letter-spacing: .4em; color: var(--gold); margin-top: calc(var(--u) * .6); }
        .clock { margin-left: auto; text-align: right; }
        .clock b { display: block; font: 600 calc(var(--u) * 3.6)/1 "Cormorant Garamond", serif; font-variant-numeric: lining-nums tabular-nums; }
        .clock span { font-size: calc(var(--u) * 1.1); letter-spacing: .14em; color: var(--mute); text-transform: uppercase; font-weight: 700; }
        .live { display: flex; align-items: center; gap: calc(var(--u) * .7); padding: calc(var(--u) * .7) calc(var(--u) * 1.2); border-radius: 999px; border: 1px solid var(--line); font-weight: 800; font-size: calc(var(--u) * 1); letter-spacing: .2em; color: var(--gold); }
        .dot { width: calc(var(--u) * .8); height: calc(var(--u) * .8); border-radius: 50%; background: var(--up); animation: pulse 2s infinite; }
        .dot.off { background: var(--down); animation: none; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(111, 211, 154, .7); } 70%, 100% { box-shadow: 0 0 0 calc(var(--u) * 1) rgba(111, 211, 154, 0); } }

        .grid { display: grid; gap: calc(var(--u) * 1.1); grid-template-columns: repeat(var(--cols, 5), minmax(0, 1fr)); grid-template-rows: repeat(var(--rows, 3), minmax(0, 1fr)); min-height: 0; }
        .tile {
            position: relative; border-radius: calc(var(--u) * 1.6); border: 1px solid var(--line); overflow: hidden;
            background: linear-gradient(160deg, rgba(36, 31, 22, .92), rgba(16, 14, 10, .95));
            padding: calc(var(--u) * 1.4) calc(var(--u) * 1.6); display: flex; flex-direction: column; justify-content: space-between; min-height: 0;
            opacity: 0; transform: translateY(calc(var(--u) * 2)); animation: in .9s cubic-bezier(.2,.7,.1,1) forwards;
        }
        .tile::after {
            content: ""; position: absolute; inset: 0; pointer-events: none; transform: translateX(-130%);
            background: linear-gradient(100deg, transparent 35%, rgba(255, 240, 190, .09) 50%, transparent 65%);
            animation: sweep 9s ease-in-out infinite; animation-delay: var(--d, 0s);
        }
        @keyframes sweep { 0%, 70% { transform: translateX(-130%); } 100% { transform: translateX(130%); } }
        @keyframes in { to { opacity: 1; transform: none; } }
        .tile.hero { grid-column: span 2; grid-row: 1 / -1; border-color: rgba(232, 200, 120, .45); background: radial-gradient(120% 100% at 100% 0%, rgba(230, 191, 85, .18), transparent 55%), linear-gradient(160deg, #2a2316, #120f0a); }
        .label { font: 800 calc(var(--u) * 1.45)/1 Manrope, sans-serif; letter-spacing: .12em; color: var(--gold); display: flex; justify-content: space-between; align-items: center; gap: calc(var(--u) * 1); }
        .hero .label { font-size: calc(var(--u) * 2.1); }
        .chg { font-size: calc(var(--u) * 1.15); letter-spacing: .02em; font-weight: 800; padding: calc(var(--u) * .35) calc(var(--u) * .7); border-radius: 999px; background: rgba(255, 255, 255, .05); }
        .up { color: var(--up); } .down { color: var(--down); }
        .sell { font: 600 calc(var(--u) * var(--fs, 4.2))/1 "Cormorant Garamond", serif; font-variant-numeric: lining-nums tabular-nums; white-space: nowrap; transition: color .6s; }
        .hero .sell { font-size: calc(var(--u) * 9); background: var(--grad); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 6s ease-in-out infinite; }
        @keyframes sheen { 50% { background-position: 100% 0; } }
        .hero .sell.flash-up, .hero .sell.flash-down { -webkit-text-fill-color: currentColor; }
        .sell small { font-size: .45em; margin-left: .15em; color: var(--mute); }
        .buy { font-size: calc(var(--u) * 1.3); color: var(--mute); font-weight: 600; font-variant-numeric: lining-nums tabular-nums; }
        .buy b { color: var(--ivory); font-weight: 700; }
        .hero .buy { font-size: calc(var(--u) * 1.9); }
        .side { display: flex; justify-content: space-between; align-items: end; gap: calc(var(--u) * 1); }
        .hero .meta { font-size: calc(var(--u) * 1.2); color: var(--mute); font-weight: 600; letter-spacing: .06em; }
        .flash-up { animation: fu 1.6s ease-out; } .flash-down { animation: fd 1.6s ease-out; }
        @keyframes fu { 0% { color: var(--up); text-shadow: 0 0 calc(var(--u) * 2) rgba(111, 211, 154, .8); } }
        @keyframes fd { 0% { color: var(--down); text-shadow: 0 0 calc(var(--u) * 2) rgba(255, 122, 107, .8); } }

        footer { display: flex; align-items: center; gap: calc(var(--u) * 1.6); border-top: 1px solid var(--line); padding-top: calc(var(--u) * 1); font-size: calc(var(--u) * 1.15); color: var(--mute); font-weight: 600; }
        footer .marquee { flex: 1; overflow: hidden; white-space: nowrap; mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
        footer .marquee > div { display: inline-flex; gap: calc(var(--u) * 4); animation: mq 40s linear infinite; padding-left: 100%; }
        footer .marquee span::before { content: "✦"; color: var(--coral); margin-right: calc(var(--u) * 1.2); }
        @keyframes mq { to { transform: translateX(-100%); } }
        footer b { color: var(--gold); }
        .note { position: fixed; inset: auto 0 0; text-align: center; font-size: 12px; color: var(--mute); padding: 6px; opacity: 0; transition: opacity .4s; cursor: default; }
        body:hover .note { opacity: 1; }
    </style>
</head>
<body>
<div class="stage">
    <header>
        <img src="/assets/mark.svg" alt="">
        <div class="brand">Mercan<small>KUYUMCULUK · OSMANİYE</small></div>
        <div class="live"><span class="dot off" id="dot"></span><span id="live">BAĞLANIYOR</span></div>
        <div class="clock"><b id="time">--:--</b><span id="date"></span></div>
    </header>
    <main class="grid" id="grid"></main>
    <footer>
        <div>Fiyatlar <b>satış</b> fiyatıdır · alış fiyatları altta</div>
        <div class="marquee"><div id="marquee"></div></div>
        <div>Bilgi: <b id="phone"></b></div>
    </footer>
</div>
<div class="note">Tam ekran için F11 · Ekran kendini otomatik günceller</div>
<script type="module">
    import { DAY_LONG, esc, fmt, fmtPct, formatPhone, istanbulNow, loadCatalog, loadConfig, siteDecimals, startLive } from "/assets/live.js";
    import { siteContent } from "/assets/site-defaults.js";

    const [config, catalog] = await Promise.all([loadConfig(), loadCatalog()]);
    const tiles = siteContent(config).tv;
    const grid = document.getElementById("grid");
    document.getElementById("phone").textContent = formatPhone(config.store.phone);

    // Layout: the first tile is a tall "hero" box two columns wide; the others fill the remaining columns.
    const others = Math.max(0, tiles.length - 1);
    const rows = others <= 2 ? Math.max(1, others) : others <= 6 ? 2 : 3;
    const cols = 2 + Math.max(1, Math.ceil(others / rows));
    grid.style.setProperty("--cols", cols);
    grid.style.setProperty("--rows", rows);
    grid.style.setProperty("--fs", cols >= 6 ? 3.4 : cols === 5 ? 4 : 4.8);
    grid.innerHTML = tiles.map((t, i) => `
        <div class="tile ${i === 0 ? "hero" : ""}" data-code="${esc(t.code)}" style="animation-delay:${i * 70}ms;--d:${i * .6}s">
            <div class="label"><span>${esc(t.label)}</span><span class="chg" data-c></span></div>
            <div class="sell" data-s>—</div>
            <div class="side"><div class="buy">Alış <b data-b>—</b></div>${i === 0 ? '<div class="meta" data-t></div>' : ""}</div>
        </div>`).join("");
    // Stretch the last box over any empty cells of the last row.
    const empty = rows * (cols - 2) - others;
    if (empty > 0 && grid.lastElementChild && others) grid.lastElementChild.style.gridColumn = `span ${empty + 1}`;

    const words = [
        "Mercan Kuyumculuk’a hoş geldiniz",
        "Ajda · Burma · Şarnel · Ankara · Ray bilezik çeşitleri",
        "Ziynet altınında güncel fiyat",
        "Altınınızı değerinde alıyoruz",
        "Fiyatlar anlık olarak güncellenir",
    ];
    if (config.announcement?.enabled && config.announcement.text) words.unshift(config.announcement.text);
    document.getElementById("marquee").innerHTML = words.map((w) => `<span>${esc(w)}</span>`).join("");

    const flash = (el, dir) => { el.classList.remove("flash-up", "flash-down"); void el.offsetWidth; el.classList.add(dir === "up" ? "flash-up" : "flash-down"); };

    startLive({
        config,
        onStatus(s) {
            document.getElementById("dot").classList.toggle("off", s !== "live");
            document.getElementById("live").textContent = s === "live" ? "CANLI" : "BAĞLANIYOR";
        },
        onUpdate(quotes) {
            for (const tile of grid.children) {
                const q = quotes.get(tile.dataset.code);
                if (!q) continue;
                const p = catalog.get(tile.dataset.code);
                const d = siteDecimals(p);
                const s = tile.querySelector("[data-s]");
                const text = q.sell == null ? "—" : fmt(q.sell, d);
                if (s.dataset.v !== text) {
                    const had = !!s.dataset.v;
                    s.dataset.v = text;
                    s.innerHTML = `${text}<small>${p?.currency === "₺" || !p ? "₺" : esc(p.currency)}</small>`;
                    if (had && q.changed) flash(s, q.sellTick);
                }
                tile.querySelector("[data-b]").textContent = q.buy == null ? "—" : fmt(q.buy, d);
                const c = tile.querySelector("[data-c]");
                c.className = "chg " + (q.changePct == null ? "" : q.changePct >= 0 ? "up" : "down");
                c.textContent = q.changePct == null ? "" : `${q.changePct >= 0 ? "▲" : "▼"} ${fmtPct(q.changePct)}`;
                c.hidden = q.changePct == null;
                const t = tile.querySelector("[data-t]");
                if (t) t.textContent = p ? (p.unitHint && p.code !== "ALTIN" ? p.unitHint : "GRAM") : "";
            }
        },
    });

    const tick = () => {
        const { date, day } = istanbulNow();
        const pad = (x) => String(x).padStart(2, "0");
        document.getElementById("time").textContent = `${pad(date.getUTCHours())}:${pad(date.getUTCMinutes())}:${pad(date.getUTCSeconds())}`;
        document.getElementById("date").textContent = `${date.getUTCDate()} ${["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"][date.getUTCMonth()]} ${DAY_LONG[day - 1]}`;
    };
    tick();
    setInterval(tick, 1000);

    // Keep the TV awake and pick up admin changes: reload every 30 minutes.
    try { await navigator.wakeLock?.request("screen"); } catch {}
    setTimeout(() => location.reload(), 30 * 60 * 1000);
</script>
</body>
</html>
