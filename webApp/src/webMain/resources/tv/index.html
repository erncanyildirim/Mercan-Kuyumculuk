<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="color-scheme" content="light">
    <title>Mağaza Ekranı · Mercan Kuyumculuk</title>
    <meta name="theme-color" content="#faf8f4">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@500;600;700&display=swap">
    <style>
        /*
         * Store TV board. Written for TV browsers (Samsung Tizen, LG webOS, Android TV, TV sticks):
         * plain script without modules or new syntax, sizes computed in script (no CSS min()/clamp()),
         * a safe margin for TVs that crop the picture edges (overscan), and a slow drift against burn-in.
         */
        html, body { margin: 0; height: 100%; overflow: hidden; background: #faf8f4; color: #1c1917; cursor: none; }
        body { font-family: Montserrat, "Segoe UI", Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
        * { box-sizing: border-box; font-variant-numeric: lining-nums tabular-nums; }
        .stage { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; transition: transform 2s ease; }
        header { display: flex; align-items: center; }
        header img { display: block; }
        .brand { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; line-height: 1; }
        .brand small { display: block; font-family: Montserrat, Arial, sans-serif; font-weight: 700; letter-spacing: .38em; color: #9a7414; }
        .clock { margin-left: auto; text-align: right; }
        .clock b { display: block; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; line-height: 1; }
        .clock span { color: #6b645c; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
        .grid { flex: 1; display: grid; }
        .tile { position: relative; background: #fff; border: 1px solid #e7e0d4; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; box-shadow: 0 1px 2px rgba(28, 25, 23, .04), 0 10px 28px -14px rgba(28, 25, 23, .18); }
        .tile::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: linear-gradient(90deg, #c9a24a, #9a7414); }
        .label { display: flex; justify-content: space-between; align-items: center; font-weight: 700; letter-spacing: .1em; color: #9a7414; white-space: nowrap; }
        .chg { font-weight: 700; letter-spacing: 0; border-radius: 999px; }
        .up { color: #15803d; background: rgba(21, 128, 61, .08); }
        .down { color: #b91c1c; background: rgba(185, 28, 28, .07); }
        .sell { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; line-height: 1; white-space: nowrap; color: #1c1917; transition: color .8s; }
        .sell small { color: #6b645c; margin-left: .12em; font-size: .5em; }
        .buy { color: #6b645c; font-weight: 600; white-space: nowrap; }
        .buy b { color: #1c1917; }
        .flash-up { color: #15803d; }
        .flash-down { color: #b91c1c; }
        footer { display: flex; align-items: center; color: #6b645c; font-weight: 600; border-top: 1px solid #e7e0d4; white-space: nowrap; overflow: hidden; }
        footer b { color: #9a7414; }
        .stale { color: #b91c1c; }
        .msg { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font: 600 13px Arial, sans-serif; color: #6b645c; padding: 6px; opacity: 0; transition: opacity .4s; cursor: default; }
        body:hover .msg { opacity: 1; }
    </style>
</head>
<body>
<div class="stage" id="stage">
    <header id="head">
        <img src="/assets/mark-dark.svg" alt="" id="logo" width="54" height="42">
        <div class="brand" id="brand">Mercan<small id="brandSub">KUYUMCULUK · OSMANİYE</small></div>
        <div class="clock"><b id="time">--:--</b><span id="date"></span></div>
    </header>
    <main class="grid" id="grid"></main>
    <footer id="foot">
        <span>Fiyatlar <b>satış</b> fiyatıdır · alış fiyatları altta</span>
        <span id="state" style="margin-left:auto"></span>
        <span style="margin-left:2em">Bilgi: <b id="phone"></b></span>
    </footer>
</div>
<div class="msg">Tam ekran için ekrana tıklayın ya da F11 · Ekran kendini otomatik günceller</div>
<script>
(function () {
    "use strict";
    var FEED = "wss://hrmsocketonly.haremaltin.com";
    var DEFAULT_TILES = [
        { code: "ALTIN", label: "HAS ALTIN" }, { code: "AYAR22", label: "22 AYAR" }, { code: "KULCEALTIN", label: "GRAM" },
        { code: "CEYREK_YENI", label: "ÇEYREK" }, { code: "YARIM_YENI", label: "YARIM" }, { code: "TEK_YENI", label: "TAM" },
        { code: "ATA_YENI", label: "ATA" }, { code: "AYAR14", label: "14 AYAR" }, { code: "USDTRY", label: "DOLAR" }, { code: "EURTRY", label: "EURO" }
    ];
    var DAYS = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
    var MONTHS = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];

    var config = { products: {}, store: { phone: "+905436118088" }, feed: { url: FEED, enabled: true } };
    var catalog = {};
    var tiles = DEFAULT_TILES;
    var raw = {};
    var shown = {};
    var lastData = 0;
    var els = [];

    function $(id) { return document.getElementById(id); }
    function getJSON(url, cb) {
        var x = new XMLHttpRequest();
        x.open("GET", url, true);
        x.onload = function () { try { cb(x.status === 200 ? JSON.parse(x.responseText) : null); } catch (e) { cb(null); } };
        x.onerror = function () { cb(null); };
        x.send();
    }
    function num(v) { var n = typeof v === "string" ? parseFloat(v.replace(",", ".")) : v; return isFinite(n) && n > 0 ? n : null; }
    function adj(v, a, pct) { if (v == null) return null; var o = pct ? v * (1 + a / 100) : v + a; return o > 0 ? o : null; }

    // Same rules as PricingEngine (shared/.../data/market/Pricing.kt).
    function price(code) {
        var o = config.products[code] || {};
        if (o.visible === false) return null;
        if (o.mode === "fixed" && (o.buy > 0 || o.sell > 0)) return { buy: o.buy > 0 ? o.buy : null, sell: o.sell > 0 ? o.sell : null, chg: null };
        var r = config.feed && config.feed.enabled === false ? null : raw[code];
        if (!r || (r.buy == null && r.sell == null)) return null;
        var buy = r.buy, sell = r.sell, close = r.close;
        if (o.mode === "adjust" && (o.buyAdj || o.sellAdj)) {
            var pct = o.adjUnit === "percent";
            buy = adj(buy, o.buyAdj || 0, pct); sell = adj(sell, o.sellAdj || 0, pct); close = adj(close, o.sellAdj || 0, pct);
        }
        return { buy: buy, sell: sell, chg: sell != null && close ? (sell - close) / close * 100 : null };
    }

    function fmt(v, d) {
        if (v == null || !isFinite(v)) return "—";
        var s = v.toFixed(d).split(".");
        var i = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        return d > 0 ? i + "," + s[1] : i;
    }
    function decimals(code) { var p = catalog[code]; return !p ? 2 : p.group === "CURRENCY" ? 2 : p.decimals; }
    function currency(code) { var p = catalog[code]; return p && p.currency && p.currency !== "₺" ? p.currency : "₺"; }
    function formatPhone(n) {
        var d = String(n || "").replace(/\D/g, "").replace(/^90/, "0");
        var m = d.match(/^(0\d{3})(\d{3})(\d{2})(\d{2})$/);
        return m ? m[1] + " " + m[2] + " " + m[3] + " " + m[4] : n;
    }

    // ---------- layout: every box the same size, all sizes from the screen ----------
    function layout() {
        var W = window.innerWidth, H = window.innerHeight;
        var safe = Math.round(Math.min(W, H) * 0.035);          // overscan margin
        var stage = $("stage");
        stage.style.width = (W - 2 * safe) + "px";
        stage.style.height = (H - 2 * safe) + "px";
        stage.style.left = safe + "px";
        stage.style.top = safe + "px";
        var u = Math.min(W / 100, H / 56.25);                   // 1% of a 16:9 frame
        var gap = Math.round(u * 1.1);
        $("head").style.marginBottom = gap + "px";
        $("logo").style.width = Math.round(u * 5.4) + "px";
        $("logo").style.height = "auto";
        $("logo").style.marginRight = Math.round(u * 1.4) + "px";
        $("brand").style.fontSize = Math.round(u * 3.1) + "px";
        $("brandSub").style.fontSize = Math.round(u * 0.85) + "px";
        $("brandSub").style.marginTop = Math.round(u * 0.5) + "px";
        $("time").style.fontSize = Math.round(u * 3.4) + "px";
        $("date").style.fontSize = Math.round(u * 1.05) + "px";
        var foot = $("foot");
        foot.style.fontSize = Math.round(u * 1.15) + "px";
        foot.style.marginTop = gap + "px";
        foot.style.paddingTop = Math.round(u * 0.9) + "px";

        var n = Math.max(1, tiles.length);
        var portrait = H > W;
        var rows = portrait ? Math.ceil(n / (n <= 4 ? 1 : 2)) : (n <= 4 ? 1 : n <= 10 ? 2 : 3);
        var cols = Math.ceil(n / rows);
        var grid = $("grid");
        grid.style.gridTemplateColumns = "repeat(" + cols + ", minmax(0, 1fr))";
        grid.style.gridTemplateRows = "repeat(" + rows + ", minmax(0, 1fr))";
        grid.style.gridGap = gap + "px";
        grid.style.gap = gap + "px";

        // Size text from the actual box size so long prices still fit.
        var gw = stage.clientWidth, gh = grid.clientHeight || (stage.clientHeight * 0.75);
        var tw = (gw - gap * (cols - 1)) / cols, th = (gh - gap * (rows - 1)) / rows;
        var sellPx = Math.min(tw / 5.2, th / 2.6);
        for (var i = 0; i < els.length; i++) {
            var e = els[i];
            e.tile.style.padding = Math.round(th * 0.12) + "px " + Math.round(tw * 0.08) + "px";
            e.tile.style.borderRadius = Math.round(u * 1.4) + "px";
            e.label.style.fontSize = Math.round(Math.min(tw / 11, th / 7.5)) + "px";
            e.chg.style.fontSize = Math.round(Math.min(tw / 17, th / 11)) + "px";
            e.chg.style.padding = Math.round(u * 0.3) + "px " + Math.round(u * 0.6) + "px";
            e.sell.style.fontSize = Math.round(sellPx) + "px";
            e.buy.style.fontSize = Math.round(Math.min(tw / 14, th / 9)) + "px";
        }
    }

    function build() {
        var grid = $("grid");
        grid.innerHTML = "";
        els = [];
        for (var i = 0; i < tiles.length; i++) {
            var tile = document.createElement("div");
            tile.className = "tile";
            tile.innerHTML = '<div class="label"><span></span><span class="chg"></span></div><div class="sell">—</div><div class="buy">Alış <b>—</b></div>';
            tile.querySelector(".label span").textContent = tiles[i].label;
            grid.appendChild(tile);
            els.push({ code: tiles[i].code, tile: tile, label: tile.querySelector(".label"), chg: tile.querySelector(".chg"),
                       sell: tile.querySelector(".sell"), buy: tile.querySelector(".buy"), buyB: tile.querySelector(".buy b") });
        }
        layout();
    }

    function render() {
        for (var i = 0; i < els.length; i++) {
            var e = els[i], q = price(e.code);
            if (!q) continue;
            var d = decimals(e.code);
            var prev = shown[e.code];
            var text = fmt(q.sell, d);
            if (prev !== text) {
                e.sell.innerHTML = text + "<small>" + currency(e.code) + "</small>";
                if (prev && q.sell != null && shown[e.code + ":v"] != null) {
                    e.sell.className = "sell " + (q.sell > shown[e.code + ":v"] ? "flash-up" : "flash-down");
                    (function (el) { setTimeout(function () { el.className = "sell"; }, 1200); })(e.sell);
                }
                shown[e.code] = text;
                shown[e.code + ":v"] = q.sell;
            }
            e.buyB.textContent = fmt(q.buy, d);
            if (q.chg == null) { e.chg.style.visibility = "hidden"; }
            else {
                e.chg.style.visibility = "visible";
                e.chg.className = "chg " + (q.chg >= 0 ? "up" : "down");
                e.chg.textContent = (q.chg >= 0 ? "▲ %" : "▼ %") + fmt(Math.abs(q.chg), 2);
            }
        }
    }

    // ---------- live feed (Socket.IO v4 over WebSocket) ----------
    var socket = null, retry = 0;
    function connect() {
        if (config.feed && config.feed.enabled === false) return;
        var base = String((config.feed && config.feed.url) || FEED).replace(/^https:/, "wss:").replace(/\/$/, "");
        var url = base.indexOf("/socket.io/") >= 0 ? base : base + "/socket.io/?EIO=4&transport=websocket";
        try { socket = new WebSocket(url); } catch (e) { setTimeout(connect, 5000); return; }
        socket.onmessage = function (m) {
            var d = String(m.data);
            if (d.charAt(0) === "0") socket.send("40");
            else if (d === "2") socket.send("3");
            else if (d.indexOf("42") === 0) {
                var arr;
                try { arr = JSON.parse(d.slice(2).replace(/^\d+/, "")); } catch (e) { return; }
                if (!arr || arr[0] !== "price_changed" || !arr[1] || !arr[1].data) return;
                retry = 0;
                lastData = Date.now();
                var data = arr[1].data;
                for (var k in data) {
                    if (!data.hasOwnProperty(k)) continue;
                    var q = data[k] || {};
                    raw[q.code || k] = { buy: num(q.alis), sell: num(q.satis), close: num(q.kapanis) };
                }
                render();
                save();
            }
        };
        socket.onclose = function () { socket = null; setTimeout(connect, Math.min(30000, 1000 * Math.pow(2, retry++))); };
    }

    function tick() {
        var t = new Date(Date.now() + 3 * 3600000);  // Istanbul time
        function pad(x) { return (x < 10 ? "0" : "") + x; }
        $("time").textContent = pad(t.getUTCHours()) + ":" + pad(t.getUTCMinutes());
        $("date").textContent = t.getUTCDate() + " " + MONTHS[t.getUTCMonth()] + " " + DAYS[t.getUTCDay()];
        var off = config.feed && config.feed.enabled === false;
        var quiet = lastData && Date.now() - lastData > 3 * 60000;
        $("state").textContent = !lastData && !off ? "Fiyatlar yükleniyor…" : quiet ? "Fiyatlar " + Math.round((Date.now() - lastData) / 60000) + " dk önce güncellendi" : "";
        $("state").className = quiet ? "stale" : "";
    }

    // Burn-in protection: shift the whole board a few pixels every 3 minutes.
    var drift = 0;
    function shift() {
        var s = Math.round(Math.min(window.innerWidth, window.innerHeight) * 0.006);
        var steps = [[0, 0], [s, 0], [s, s], [0, s], [-s, s], [-s, 0], [-s, -s], [0, -s]];
        var p = steps[drift++ % steps.length];
        $("stage").style.transform = "translate(" + p[0] + "px," + p[1] + "px)";
    }

    // Last config, catalog and prices are kept on the TV so the board fills instantly on start
    // (the live feed needs a few seconds to connect), then the live feed takes over.
    var CACHE = "mercan.tv.cache.v1", savedAt = 0, started = false;
    function save() {
        if (Date.now() - savedAt < 5000) return;
        savedAt = Date.now();
        try { localStorage.setItem(CACHE, JSON.stringify({ config: config, catalog: catalog, raw: raw, at: lastData })); } catch (e) {}
    }
    function restore() {
        try {
            var c = JSON.parse(localStorage.getItem(CACHE) || "null");
            if (!c || !c.raw) return false;
            config = c.config || config; catalog = c.catalog || {}; raw = c.raw; lastData = c.at || 0;
            return true;
        } catch (e) { return false; }
    }

    function start() {
        if (started) { applyConfig(); return; }
        started = true;
        $("phone").textContent = formatPhone(config.store && (config.store.phone || config.store.whatsapp));
        applyConfig();
        connect();
        tick();
        setInterval(tick, 1000);
        setInterval(shift, 3 * 60000);
    }

    function applyConfig() {
        $("phone").textContent = formatPhone(config.store && (config.store.phone || config.store.whatsapp));
        var next = config.site && config.site.tv && config.site.tv.length ? config.site.tv : DEFAULT_TILES;
        if (!els.length || JSON.stringify(next) !== JSON.stringify(tiles)) { tiles = next; shown = {}; build(); }
        render();
    }

    if (restore()) start();
    var waiting = 2;
    function ready() { if (--waiting === 0) start(); }
    getJSON("/api/config", function (doc) {
        if (doc) {
            config = doc;
            config.products = doc.products || {};
            config.store = doc.store || { phone: "+905436118088" };
            config.feed = doc.feed || { url: FEED, enabled: true };
        }
        ready();
    });
    getJSON("/catalog.json", function (doc) {
        if (doc && doc.products) for (var i = 0; i < doc.products.length; i++) catalog[doc.products[i].code] = doc.products[i];
        ready();
    });

    window.addEventListener("resize", layout);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
    // Click / OK on the remote: go full screen.
    document.addEventListener("click", function () {
        var el = document.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen;
        if (f && !document.fullscreenElement && !document.webkitFullscreenElement) { try { f.call(el); } catch (e) {} }
    });
    // Keep the screen awake where supported, and pick up admin changes every 30 minutes.
    function wake() { try { if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(function () {}); } catch (e) {} }
    wake();
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") { wake(); if (!socket) connect(); } });
    setTimeout(function () { location.reload(); }, 30 * 60000);
})();
</script>
</body>
</html>
